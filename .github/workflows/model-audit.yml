name: Audit whole archival model across stations and train types
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railpulse-model-integrity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and model dependencies
        run: python -m pip install -e '.[dashboard,ml,dev]'
      - name: Run complete regression and contract test suite
        run: python -m pytest -q
      - name: Inspect real September and October archival records
        run: python -m railpulse audit-model
      - name: Verify only aggregate outputs exist
        shell: bash
        run: |
          test -f reports/model_audit_summary.json
          test -f reports/model_audit_cohorts.csv
          test -f reports/model_audit_calibration.csv
          test -f reports/model_audit_coverage.csv
          if find reports -type f | grep -E '\.(parquet|duckdb|sqlite|db|xml|pb)$'; then
            echo 'Unexpected unaggregated data under reports/' >&2
            exit 1
          fi
      - name: Upload aggregate-only archive audit
        uses: actions/upload-artifact@v4
        with:
          name: railpulse-model-integrity-audit
          path: |
            reports/model_audit_summary.json
            reports/model_audit_cohorts.csv
            reports/model_audit_calibration.csv
            reports/model_audit_coverage.csv
          retention-days: 7
          if-no-files-found: error
