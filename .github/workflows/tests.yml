name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ml,dev]'
      - run: python -m pytest -q
      - name: Prevent accidental data and secret commits
        shell: bash
        run: |
          if git ls-files | grep -E '(^data/(raw|processed)/|^reports/|\.(parquet|duckdb|sqlite|pem|key)$|^\.env($|\.))'; then
            echo 'Unsafe data or credential file tracked' >&2
            exit 1
          fi
