name: Multi-month model diagnostics (October already inspected)
on:
  push:
    paths:
      - ".github/workflows/ml-multimonth.yml"
      - "railpulse/ml_multimonth.py"
      - "tests/test_ml_multimonth.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railpulse-multimonth
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependencies
        run: python -m pip install -e '.[ml,dev]'
      - name: Run synthetic tests
        run: python -m pytest -q
      - name: Train July-August, validate September, compare October diagnostically
        run: python -m railpulse ml-multimonth
      - name: Verify aggregate-only outputs
        shell: bash
        run: |
          test -f reports/ml_multimonth_metrics.json
          test -f reports/ml_multimonth_comparison.csv
          if find reports -type f | grep -E '\.(parquet|duckdb|sqlite|db|xml|pb)$'; then
            echo 'Unexpected row-level data in reports folder' >&2
            exit 1
          fi
      - name: Upload summary metrics only
        uses: actions/upload-artifact@v4
        with:
          name: railpulse-multimonth-diagnostics
          path: |
            reports/ml_multimonth_metrics.json
            reports/ml_multimonth_comparison.csv
          retention-days: 7
          if-no-files-found: error
