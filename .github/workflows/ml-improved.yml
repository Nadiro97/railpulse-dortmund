name: Improve September timetable-update model
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Dataset month YYYY-MM"
        required: true
        default: "2026-09"
  push:
    paths:
      - ".github/workflows/ml-improved.yml"
permissions:
  contents: read
concurrency:
  group: railpulse-ml-improved
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.month || '2026-09' }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ML and test dependencies
        run: python -m pip install -e '.[ml,dev]'
      - name: Run synthetic tests
        run: python -m pytest -q
      - name: Download processed archive and extract Dortmund privately
        run: |
          python -m railpulse download --month "$MONTH"
          python -m railpulse extract --month "$MONTH"
      - name: Validate candidate models on earlier dates and evaluate untouched test
        run: python -m railpulse ml-improve --month "$MONTH"
      - name: Verify aggregate-only outputs
        run: |
          test -f reports/ml_improved_metrics.json
          test -f reports/ml_improved_comparison.csv
      - name: Publish aggregate-only evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: railpulse-ml-improved-${{ env.MONTH }}
          path: |
            reports/ml_improved_metrics.json
            reports/ml_improved_comparison.csv
          retention-days: 7
          if-no-files-found: error
