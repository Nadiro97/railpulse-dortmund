name: Train route-aware Dortmund timetable-update minutes (September 2026)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railpulse-route-minutes
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model and dashboard test dependencies
        run: python -m pip install -e '.[dashboard,ml,dev]'
      - name: Validate repository and synthetic route tests
        run: python -m pytest -q
      - name: Train separate arrival and departure route models and evaluate
        run: python -m railpulse train-route-delay --mode both
      - name: Check only aggregate results are uploaded
        shell: bash
        run: |
          test -f reports/route_minutes_arrival_metrics.json
          test -f reports/route_minutes_departure_metrics.json
          if find reports -type f | grep -E '\.(parquet|duckdb|sqlite|db|xml|pb|joblib|pkl)$'; then
            echo 'Unexpected sensitive data in reports/' >&2
            exit 1
          fi
      - name: Upload summary scores only, never trained model coefficients
        uses: actions/upload-artifact@v4
        with:
          name: railpulse-route-minutes-september-2026
          path: |
            reports/route_minutes_arrival_metrics.json
            reports/route_minutes_departure_metrics.json
          retention-days: 7
          if-no-files-found: error
