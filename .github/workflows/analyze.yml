name: Analyze historical Dortmund train data

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Processed data release (YYYY-MM)"
        required: true
        default: "2026-09"

permissions:
  contents: read

concurrency:
  group: railpulse-monthly-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.month || '2026-09' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline requirements
        run: python -m pip install -e .
      - name: Download one CC BY 4.0 monthly release; extract Dortmund; validate and aggregate
        run: python -m railpulse run --month "$MONTH"
      - name: Record provenance with reports
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          month = __import__('os').environ['MONTH']
          metadata = json.loads(Path("data/processed/extraction_metadata.json").read_text())
          summary = {
              "month": month,
              "source": metadata["source"],
              "upstream_file": metadata["upstream_file"],
              "retrieved_at_utc": metadata["extracted_at_utc"],
              "dortmund_station_stops": metadata["dortmund_rows"],
              "station_count": metadata["dortmund_stations"],
              "licence": "CC BY 4.0",
              "attribution": "Deutsche Bahn timetable updates; historical archive by Piet Brömmel; filtered/aggregated for Dortmund",
              "time_value_note": "updated arrival times are not necessarily confirmed actual arrivals",
              "privacy": "aggregated reports only; no raw or row-level stop data in artifact",
          }
          Path("reports/provenance.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY
      - name: Confirm no row-level data is in the published reports folder
        shell: bash
        run: |
          if find reports -type f | grep -E '\\.(parquet|duckdb|db|sqlite|xml|pb)$'; then
            echo "Unexpected data file in aggregate reports" >&2
            exit 1
          fi
      - name: Upload aggregate reports only (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: dortmund-aggregates-${{ env.MONTH }}
          path: |
            reports/*.csv
            reports/provenance.json
          retention-days: 7
          if-no-files-found: error
