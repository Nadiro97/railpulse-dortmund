name: Historical timetable-update ML baseline

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to use for chronological train/test split (YYYY-MM)"
        required: true
        default: "2026-09"

permissions:
  contents: read

concurrency:
  group: railpulse-ml-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.month || '2026-09' }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[ml,dev]'
      - name: Run synthetic unit tests
        run: python -m pytest -q
      - name: Download archive and extract Dortmund to ephemeral runner storage
        run: |
          python -m railpulse download --month "$MONTH"
          python -m railpulse extract --month "$MONTH"
      - name: Train chronological logistic baseline on explicit arrival updates
        run: python -m railpulse ml-baseline --month "$MONTH"
      - name: Validate only summary files are uploaded
        run: |
          test -f reports/ml_baseline_metrics.json
          test -f reports/ml_baseline_comparison.csv
      - name: Upload model metrics only (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: railpulse-ml-baseline-${{ env.MONTH }}
          path: |
            reports/ml_baseline_metrics.json
            reports/ml_baseline_comparison.csv
          retention-days: 7
          if-no-files-found: error
